name: Build Windows Portable

on:
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-2025-vs2026

    steps:
      - name: Disable Git CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter with FVM
        shell: powershell
        run: |
          dart pub global activate fvm
          fvm install
          fvm use --force

          $flutterPath = "$((Get-Item .).FullName)\.fvm\flutter_sdk\bin"
          $flutterPath | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: Flutter pub get
        run: fvm flutter pub get

      - name: Build Windows Release
        run: |
          fvm flutter build windows --release

      - name: Prepare portable build
        shell: powershell
        run: |
          $source = "build\windows\x64\runner\Release"
          $target = "Breeze-Portable"

          if (!(Test-Path $source)) {
            throw "Windows Release directory not found: $source"
          }

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item `
            -Path "$source\*" `
            -Destination $target `
            -Recurse `
            -Force

          # 以后真正便携版的数据目录
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$target\portable_data" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$target\portable_data\downloads" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$target\portable_data\cache" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$target\portable_data\config" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$target\portable_data\database" |
            Out-Null

      - name: Create portable zip
        shell: powershell
        run: |
          Compress-Archive `
            -Path "Breeze-Portable\*" `
            -DestinationPath "Breeze-Windows-Portable.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v6
        with:
          name: Breeze-Windows-Portable
          path: Breeze-Windows-Portable.zip
          retention-days: 30
